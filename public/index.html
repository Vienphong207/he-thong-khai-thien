<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thần Cấp Toàn Năng</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('/bg1.jpg');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            transition: background-image 0.6s ease-in-out;
            color: #ffffff;
            padding: 20px;
        }
        .card {
            background: rgba(12, 14, 28, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 30px 24px;
            max-width: 380px;
            width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .avatar-box {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }
        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2b714;
            box-shadow: 0 0 25px rgba(226, 183, 20, 0.6);
        }
        .title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffd700, #ff7300, #e066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .quote-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-style: italic;
        }
        .quote-box span {
            color: #ffd700;
            font-weight: bold;
            font-style: normal;
        }
        .tag-btn {
            background: rgba(0, 230, 118, 0.12);
            border: 1px solid rgba(0, 230, 118, 0.4);
            color: #00e676;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .ky-canh-btn {
            background: rgba(186, 104, 200, 0.12);
            border: 1px solid rgba(186, 104, 200, 0.4);
            color: #ce93d8;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .action-btn {
            background: linear-gradient(135deg, #4a00e0, #8e2de2);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(142, 45, 226, 0.4);
            transition: all 0.3s ease;
        }
        .action-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 10px rgba(142, 45, 226, 0.2);
        }
    </style>

<style>
  /* 1. Khung đen thành Kính Mờ xuyên thấu nhìn rõ Dị Cảnh */
  div[class*="bg-"], div[class*="card"], main > div, .max-w-md {
    background: rgba(15, 23, 42, 0.35) !important;
    backdrop-filter: blur(12px) !important;
    -webkit-backdrop-filter: blur(12px) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }

  /* 2. Chế độ Thu Gọn chỉ chừa nút Vận Hành Thần Thức */
  .focus-active {
    background: transparent !important;
    border: none !important;
    backdrop-filter: none !important;
    box-shadow: none !important;
  }
  .focus-active .hide-on-focus {
    opacity: 0 !important;
    max-height: 0 !important;
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
    pointer-events: none !important;
    transition: all 0.4s ease !important;
  }
</style>

</head>
<body>

    <div class="card">
        <div class="avatar-box">
            <img src="/avatar.jpg" alt="Avatar" class="avatar">
        </div>
        
        <h1 class="title">HỆ THỐNG THẦN CẤP TOÀN NĂNG</h1>
        
        <div class="quote-box">
            "Đạo hữu, chào mừng đến với thế giới của những kẻ mạnh, <span>Tiểu Phong</span> luôn sẵn sàng đồng hành thăng cấp cùng ngươi!"
        </div>

        <div>
            <div class="tag-btn">🟢 Thần Thức Kết Nối • Viễn Phong</div>
        </div>
        <div>
            <div class="ky-canh-btn" id="ky-canh-tag">⚔️ Kỳ Cảnh: Vân Hà Tiên Sơn</div>
        </div>

        <button class="action-btn" onclick="vanHanhThanThuc()">⚔️ VẬN HÀNH THẦN THỨC</button>
    </div>

    <script>
        const diCanhList = [
            { name: "Vân Hà Tiên Sơn", src: "/bg1.jpg" },
            { name: "Tử Nguyệt Điện Vũ", src: "/bg2.jpg" },
            { name: "Vạn Đỉnh Sương Mảnh", src: "/bg3.jpg" },
            { name: "Hàn Lăng Tuyết Thú", src: "/bg4.jpg" }
        ];

        let currentDiCanhIndex = 0;

        // Preload 4 ảnh vào RAM điện thoại
        diCanhList.forEach(item => {
            const img = new Image();
            img.src = item.src;
        });

        function vanHanhThanThuc() {
            currentDiCanhIndex = (currentDiCanhIndex + 1) % diCanhList.length;
            const current = diCanhList[currentDiCanhIndex];
            
            document.body.style.backgroundImage = `url('${current.src}')`;
            
            const tag = document.getElementById('ky-canh-tag');
            if (tag) {
                tag.innerText = `⚔️ Kỳ Cảnh: ${current.name}`;
            }
        }
    </script>
</body>
</html>
